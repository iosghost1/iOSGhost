<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOSGhost</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle,#0f0c29,#000);
  color:white;
  text-align:center;
}

.logo img {
  width:120px;
  margin-top:40px;
  border-radius:50%;
  box-shadow:0 0 25px red;
}

h1 span { color:#9b5cff; }

.box {
  background:rgba(255,255,255,0.05);
  margin:25px;
  padding:20px;
  border-radius:15px;
}

.btn {
  background:purple;
  padding:12px 25px;
  border-radius:10px;
  text-decoration:none;
  color:white;
}

.app {
  background:rgba(255,255,255,0.05);
  margin:15px;
  padding:15px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.app img { width:50px; border-radius:10px; }

.download {
  background:#00c853;
  padding:8px 15px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGO (vetëm këtë ndrysho) -->
<div class="logo">
  <img src="logo.png">
</div>

<h1>iOS<span>Ghost</span></h1>

<div class="box">
  <h3>STEP 1</h3>
  <p>Join Telegram</p>
  <a href="https://t.me/i0sghost" target="_blank" class="btn">JOIN</a>

  <h3>STEP 2</h3>
  <p>Open bot and get code</p>

  <h3>STEP 3</h3>
  <p>Enter code to unlock</p>
</div>

<!-- APPS -->

<div class="app">
  <img src="esign.png">
  <span>eSign</span>
  <div class="download" onclick="go('LINK1')">Download</div>
</div>

<div class="app">
  <img src="trollstore.png">
  <span>TrollStore</span>
  <div class="download" onclick="go('LINK2')">Download</div>
</div>

<div class="app">
  <img src="filza.png">
  <span>Filza</span>
  <div class="download" onclick="go('LINK3')">Download</div>
</div>

<script>
async function go(link){
  let code = prompt("Enter your code:");

  let res = await fetch("https://LINKU-YT-REPLIT/verify?code="+code);
  let data = await res.json();

  if(data.ok){
    alert("Unlocked!");
    window.location.href = link;
  } else {
    alert("Wrong code!");
  }
}
</script>

</body>
</html>
