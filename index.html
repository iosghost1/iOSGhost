<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOSGhost Store</title>
  <style>
    :root { --cyan: #00ffe1; --bg: #000; --card: #1c1c1e; --red: #ff3b30; --blue: #007aff; }
    body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, sans-serif; text-align: center; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #000; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; }
    .menu-btn { font-size: 30px; cursor: pointer; color: var(--cyan); }
    .main-logo { width: 60px; height: 60px; border-radius: 14px; border: 2px solid var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    .side-menu { position: fixed; top: 0; left: -280px; width: 250px; height: 100%; background: var(--card); transition: 0.3s; padding: 30px 20px; z-index: 2000; text-align: left; }
    .side-menu.active { left: 0; }
    .menu-item { display: block; padding: 18px 0; color: white; text-decoration: none; border-bottom: 1px solid #333; font-size: 18px; }
    .container { padding: 20px; max-width: 500px; margin: auto; }
    .step-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #333; text-align: left; margin-bottom: 25px; }
    .step { display: flex; margin-bottom: 15px; font-size: 14px; align-items: center; }
    .step-n { background: var(--cyan); color: #000; font-weight: bold; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px; }
    input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #444; background: #2c2c2e; color: white; text-align: center; font-size: 16px; box-sizing: border-box; }
    .btn-verify { width: 100%; background: var(--cyan); color: #000; padding: 15px; border-radius: 12px; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; }
    .app-card { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid #222; text-align: left; }
    .app-img { width: 65px; height: 65px; border-radius: 15px; margin-right: 15px; object-fit: cover; background: #222; }
    .btn-l { background: #2c2c2e; color: var(--red); padding: 7px 15px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .btn-g { display: none; background: #2c2c2e; color: var(--blue); padding: 7px 15px; border-radius: 20px; font-weight: bold; text-decoration: none; font-size: 13px; }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1500; }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="side-menu" id="sideMenu">
    <div onclick="toggleMenu()" style="text-align:right; font-size:25px; color:var(--cyan); cursor:pointer;">✕</div>
    <a href="https://tiktok.com" target="_blank" class="menu-item">TikTok</a>
    <a href="https://t.me" target="_blank" class="menu-item" style="color:var(--red);">Report Problem</a>
  </div>
  <div class="nav">
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <img src="logo.png" class="main-logo">
    <div style="width:30px;"></div>
  </div>
  <div class="container">
    <div class="step-card">
      <div class="step"><div class="step-n">1</div>Join <a href="https://t.me" target="_blank" style="color:var(--cyan); font-weight:bold;">Telegram Group</a></div>
      <div class="step"><div class="step-n">2</div>Get code from Bot</div>
      <input type="text" id="codeIn" placeholder="ENTER 6-DIGIT CODE">
      <button class="btn-verify" onclick="unlock()">Verify & Unlock</button>
    </div>

    <!-- KSING -->
    <div class="app-card">
      <img src="ksign.png" class="app-img">
      <div style="flex-grow:1;"><h3>KSing</h3><p>Premium Tool</p></div>
      <div class="btn-l lock">LOCKED</div>
      <a href="itms-services://?action=download-manifest&url=https://githubusercontent.com" class="btn-g get">GET</a>
    </div>

    <!-- TROLLSTORE (FAKE) -->
    <div class="app-card">
      <img src="troll.png" class="app-img">
      <div style="flex-grow:1;"><h3>TrollStore</h3><p>Installer</p></div>
      <div class="btn-l lock">LOCKED</div>
      <a href="javascript:void(0)" class="btn-g get" onclick="alert('Maintenance')">GET</a>
    </div>

    <!-- NETFLIX -->
    <div class="app-card">
      <img src="netflix.png" class="app-img">
      <div style="flex-grow:1;"><h3>Netflix</h3><p>Movies & Series</p></div>
      <div class="btn-l lock">LOCKED</div>
      <a href="itms-services://?action=download-manifest&url=https://githubusercontent.com" class="btn-g get">GET</a>
    </div>

    <!-- PICSART -->
    <div class="app-card">
      <img src="picsart.png" class="app-img">
      <div style="flex-grow:1;"><h3>PicsArt</h3><p>Photo Editor</p></div>
      <div class="btn-l lock">LOCKED</div>
      <a href="itms-services://?action=download-manifest&url=https://githubusercontent.com" class="btn-g get">GET</a>
    </div>

    <!-- GTA -->
    <div class="app-card">
      <img src="gtasa.png" class="app-img">
      <div style="flex-grow:1;"><h3>GTA SA</h3><p>Classic Mod</p></div>
      <div class="btn-l lock">LOCKED</div>
      <a href="itms-services://?action=download-manifest&url=https://githubusercontent.com" class="btn-g get">GET</a>
    </div>
  </div>

  <script>
    function toggleMenu(){ 
      const m = document.getElementById('sideMenu');
      m.classList.toggle('active');
      document.getElementById('overlay').style.display = m.classList.contains('active') ? 'block' : 'none';
    }
    function unlock(){
      const val = document.getElementById('codeIn').value.trim();
      if(val.length === 6){
        document.querySelectorAll('.lock').forEach(e => e.style.display = 'none');
        document.querySelectorAll('.get').forEach(e => e.style.display = 'block');
        alert("Success! Apps Unlocked ✅");
      } else { alert("Invalid Code! ❌"); }
    }
  </script>
</body>
</html>
