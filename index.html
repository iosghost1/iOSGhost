<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOSGhost</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:white;
}

/* HEADER */
.header {
    text-align:center;
    padding:20px;
}
.logo {
    width:80px;
    border-radius:50%;
}
.title {
    font-size:22px;
    margin-top:10px;
}
.telegram {
    display:inline-block;
    margin-top:10px;
    padding:8px 15px;
    background:#00ff9d;
    color:black;
    border-radius:20px;
    text-decoration:none;
    font-weight:bold;
}

/* SEARCH */
.search {
    padding:15px;
}
.search input {
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#1c222b;
    color:white;
}

/* APP */
.app {
    display:flex;
    padding:15px;
    border-bottom:1px solid #1c222b;
    align-items:center;
}
.app img {
    width:60px;
    border-radius:15px;
    margin-right:10px;
}
.info {
    flex:1;
}
.buttons {
    display:flex;
    flex-direction:column;
    gap:5px;
}
.btn {
    padding:7px;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
}
.fast {
    background:#00ff9d;
    color:black;
}
.backup {
    border:1px solid #00ff9d;
    color:#00ff9d;
    background:transparent;
}

/* NAV */
.nav {
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b0f14;
    display:flex;
    justify-content:space-around;
    padding:10px;
    border-top:1px solid #1c222b;
}
.nav button {
    background:none;
    border:none;
    color:#00ff9d;
}

/* SETTINGS */
#settings {
    display:none;
    padding:20px;
}

.footer {
    text-align:center;
    font-size:12px;
    color:#aaa;
    padding:20px;
}
</style>
</head>

<body>

<!-- APPS -->
<div id="appsPage">

<div class="header">
<img src="LOGO_LINK" class="logo">
<div class="title">iOSGhost Store</div>
<a href="https://t.me/i0sghost" class="telegram">JOIN TELEGRAM</a>
</div>

<div class="search">
<input type="text" id="search" placeholder="Search apps..." onkeyup="searchApp()">
</div>

<div id="apps">

<script>
function app(name){
return `
<div class="app">
<img src="https://via.placeholder.com/60">
<div class="info">
<h3>${name}</h3>
<p>Version • MB</p>
</div>
<div class="buttons">
<button onclick="window.location='FAST_LINK'" class="btn fast">Fast Download</button>
<button onclick="window.location='BACKUP_LINK'" class="btn backup">Backup Download</button>
</div>
</div>`
}

document.write(
app("Netflix") +
app("Red Dead Redemption") +
app("Shadow Fight 4 Arena") +
app("GTA San Andreas") +
app("GTA Vice City") +
app("8 Ball Pool (MOD)") +
app("Car Parking") +
app("Minecraft") +
app("ESign") +
app("Alight Motion") +
app("InShot") +
app("VSCO")
);
</script>

</div>

<div class="footer">
Per gjdo problem dhe per me shum appe, na kontaktoni ne privat ne telegram.
</div>

</div>

<!-- SETTINGS -->
<div id="settings">
<h2>Settings</h2>

<p>Telegram Group:</p>
<a href="https://t.me/i0sghost" class="telegram">Open Group</a>

<br><br>

<p>Report a problem:</p>
<a href="https://t.me/iosghostt?text=I%20have%20a%20problem" class="telegram">
Send Report
</a>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showApps()">Apps</button>
<button onclick="showSettings()">Settings</button>
</div>

<script>
function searchApp() {
let input = document.getElementById("search").value.toLowerCase();
let apps = document.getElementsByClassName("app");
for (let i = 0; i < apps.length; i++) {
let text = apps[i].innerText.toLowerCase();
apps[i].style.display = text.includes(input) ? "flex" : "none";
}
}

function showApps(){
document.getElementById("appsPage").style.display="block";
document.getElementById("settings").style.display="none";
}

function showSettings(){
document.getElementById("appsPage").style.display="none";
document.getElementById("settings").style.display="block";
}
</script>

</body>
</html>
